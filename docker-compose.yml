version: "3.8"

services:
  api:
    container_name: geoip_api
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    # Databases are baked into the image. To use your own .mmdb files
    # (dbip-*-lite.mmdb or GeoLite2-*.mmdb), mount them here instead:
    # volumes:
    #   - ./data:/usr/share/GeoIP
    restart: always

networks:
  default:
    driver: bridge
